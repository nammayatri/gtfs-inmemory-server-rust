[package]
name = "gtfs-routes-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gtfs-routes-service"
path = "src/main.rs"

[dependencies]
# Web framework
actix-web = "4.3.1"
actix-http = "3.4.0"
actix = "0.13.0"
actix-cors = "0.6"
actix-web-prom = "0.7.0"

# HTTP client
reqwest = { version = "0.11", features = ["json", "gzip", "deflate"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
# float_roundtrip: parse a float to the exact double its text names (the default
# parser may be one bit off), so a GTFS value read back out of Postgres is the
# value that went in (docs/gtfs-editor.md section 18).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# Self-describing binary (de)serialization for the preprocessed boot snapshot.
# MessagePack with map-encoded structs is used so serde field attributes
# (skip_serializing_if / skip_serializing / rename / default) round-trip exactly
# like the JSON path the loader already relies on.
rmp-serde = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"

# Tracing
prometheus = { version = "0.13.3", features = ["process"] }
once_cell = "1.17.1"

# Configuration
config = "0.14"
dotenv = "0.15"
dhall = "0.11"
serde_dhall = "0.12"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# URL parsing and encoding
url = "2.5"
urlencoding = "2.1"

# Hash computation
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# A pattern's public id is gtfs_preprocessor.py's md5 of its stop ids
# (docs/gtfs-editor.md section 16). Already in the tree through sqlx.
md-5 = "0.10"

# GTFS editor auth: ES256 JWT verification, AES-256-GCM, HMAC-SHA1 (TOTP) and
# secure randomness. ring is already in the tree through rustls.
ring = "0.17"
base64 = "0.22"

# Lock-free atomic pointer swap for double-buffered cache
arc-swap = "1"

# System information
sysinfo = "0.30"

# Rate limiting
governor = "0.6"

# System calls for socket optimization
libc = "0.2"

# Connection pooling
deadpool = "0.12"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Database support
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "macros", "uuid"] }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# CSV parsing
csv = "1.3"

# GTFS zips in and out (docs/gtfs-editor.md section 18). Already in the tree
# through utoipa-swagger-ui, with the same features.
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }

# CPU detection for optimal worker count
num_cpus = "1.0"

regex = "1.10.3"

# OpenAPI / Swagger
utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
shared = { git = "https://github.com/nammayatri/shared-kernel-rs", rev = "05af149" }
macros = { git = "https://github.com/nammayatri/shared-kernel-rs", rev = "05af149" }

[dev-dependencies]
tokio-test = "0.4"
